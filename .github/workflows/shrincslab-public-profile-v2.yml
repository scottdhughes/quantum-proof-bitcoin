name: SHRINCS public zero-value labnet v2

on:
  push:
    branches:
      - integration/shrincslab-public-profile
  pull_request:
    paths:
      - "src/chainparams*"
      - "src/kernel/chainparams*"
      - "src/consensus/params.h"
      - "src/script/interpreter.*"
      - "src/script/shrincs_tx_v0.*"
      - "src/test/shrincslab_chainparams_tests.cpp"
      - "src/test/CMakeLists.txt"
      - "ci/test/test_shrincs_tx_cpp_component.py"
      - "test/functional/feature_shrincs_regtest.py"
      - "test/functional/test_framework/address.py"
      - "contrib/devtools/apply_shrincslab_public_profile.py"
      - "contrib/devtools/normalize_shrincslab_materializer.py"
      - "contrib/shrincs-labnet/**"
      - "docs/PQBTC_SHRINCS_PUBLIC_LABNET.md"
      - ".github/workflows/shrincslab-public-profile-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shrincslab-public-profile-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-mine:
    name: materialize, build, spend, mine, and isolate
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out PQBTC
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize and materialize dedicated network profile
        run: |
          set -euo pipefail
          python3 contrib/devtools/normalize_shrincslab_materializer.py
          python3 contrib/devtools/apply_shrincslab_public_profile.py
          python3 contrib/devtools/apply_shrincslab_public_profile.py >/tmp/shrincslab-idempotence.json
          git diff --check

      - name: Prove static architecture and controller contracts
        run: |
          set -euo pipefail
          python3 ci/test/test_shrincs_tx_cpp_component.py
          python3 contrib/shrincs-labnet/test_labnet.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("contrib/shrincs-labnet/manifest.json").read_text())
          assert manifest["network"]["genesis_hash"] == "122201a7b5dc205ec063486e4080760ab8f73c3f07804d69351da96bd6c2ab69"
          assert manifest["network"]["message_magic"] == "91e1cac8"
          assert manifest["network"]["bech32_hrp"] == "pqsl"
          assert manifest["consensus_activation"]["ordinary_regtest"] is False
          assert manifest["consensus_activation"]["shrincslab"] is True
          PY
          docker compose -f contrib/shrincs-labnet/docker-compose.shrincslab.yml config >/tmp/shrincslab-compose.yml

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build libboost-dev libevent-dev \
            libsqlite3-dev pkg-config

      - name: Configure wallet-enabled build
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_GUI=OFF -DBUILD_GUI_TESTS=OFF -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF -DBUILD_KERNEL_LIB=OFF \
            -DENABLE_WALLET=ON -DENABLE_IPC=OFF \
            -DENABLE_EXTERNAL_SIGNER=OFF -DWITH_ZMQ=OFF \
            -DWITH_USDT=OFF -DBUILD_TESTS=ON

      - name: Build node, CLI, wallet, verifier, and tests
        run: cmake --build build --parallel 2

      - name: Execute native chain identity and SHRINCS suites
        run: |
          build/bin/test_pqbtc \
            --run_test=shrincslab_chainparams_tests,shrincs_tx_v0_tests,shrincs_tx_v0_signed_seam_tests \
            --catch_system_error=no \
            --log_level=test_suite

      - name: Check out exact upstream signer model
        run: |
          git clone https://github.com/SHRINCS/shrincs-bip.git "$RUNNER_TEMP/shrincs-bip"
          git -C "$RUNNER_TEMP/shrincs-bip" checkout acc6bda51dc3b94848d118967247ad0f3cd7a80e
          test "$(git -C "$RUNNER_TEMP/shrincs-bip" rev-parse HEAD)" = acc6bda51dc3b94848d118967247ad0f3cd7a80e

      - name: Mine and spend both SHRINCS modes through functional validation
        env:
          SHRINCS_BIP_DIR: ${{ runner.temp }}/shrincs-bip
        run: |
          build/test/functional/feature_shrincs_regtest.py \
            --tmpdir="$RUNNER_TEMP/functional-shrincslab" \
            --nocleanup

      - name: Run persistent two-node wallet and signer lifecycle
        run: |
          python3 contrib/shrincs-labnet/labnet.py \
            --build-dir "$GITHUB_WORKSPACE/build" \
            --state-dir "$RUNNER_TEMP/shrincslab" \
            quickstart --fresh --mode both --no-build

      - name: Verify identity, address namespace, and ordinary-regtest isolation
        run: |
          set -euo pipefail
          CLI=build/bin/pqbtc-cli
          LAB0="$RUNNER_TEMP/shrincslab/node0"
          test "$($CLI -regtest -shrincslab -datadir="$LAB0" getblockhash 0)" = \
            "122201a7b5dc205ec063486e4080760ab8f73c3f07804d69351da96bd6c2ab69"
          ADDRESS=$($CLI -regtest -shrincslab -datadir="$LAB0" -rpcwallet=shrincs-labnet getnewaddress)
          case "$ADDRESS" in pqsl1*) ;; *) echo "unexpected labnet address: $ADDRESS"; exit 1 ;; esac

          REGDIR="$RUNNER_TEMP/ordinary-regtest"
          mkdir -p "$REGDIR"
          build/bin/pqbtcd -regtest -datadir="$REGDIR" -port=30444 -rpcport=30443 \
            -server=1 -listen=1 -discover=0 -dnsseed=0 -fixedseeds=0 -daemonwait
          trap '$CLI -regtest -datadir="$REGDIR" stop >/dev/null 2>&1 || true; python3 contrib/shrincs-labnet/labnet.py --build-dir "$GITHUB_WORKSPACE/build" --state-dir "$RUNNER_TEMP/shrincslab" stop >/dev/null 2>&1 || true' EXIT
          $CLI -regtest -datadir="$REGDIR" addnode 127.0.0.1:29333 onetry || true
          sleep 3
          test "$($CLI -regtest -datadir="$REGDIR" getconnectioncount)" -eq 0
          $CLI -regtest -datadir="$REGDIR" stop >/dev/null
          python3 contrib/shrincs-labnet/labnet.py \
            --build-dir "$GITHUB_WORKSPACE/build" \
            --state-dir "$RUNNER_TEMP/shrincslab" stop >/dev/null
          trap - EXIT

      - name: Commit validated materialized profile
        if: ${{ github.event_name == 'push' && github.ref_name == 'integration/shrincslab-public-profile' }}
        run: |
          set -euo pipefail
          git add \
            contrib/devtools/apply_shrincslab_public_profile.py \
            src/chainparams.cpp src/chainparamsbase.cpp \
            src/kernel/chainparams.cpp src/kernel/chainparams.h \
            src/script/interpreter.cpp src/script/shrincs_tx_v0.cpp \
            src/script/shrincs_tx_v0.h src/test/CMakeLists.txt \
            src/test/shrincslab_chainparams_tests.cpp \
            ci/test/test_shrincs_tx_cpp_component.py \
            test/functional/feature_shrincs_regtest.py \
            test/functional/test_framework/address.py \
            contrib/shrincs-labnet docs/PQBTC_SHRINCS_PUBLIC_LABNET.md
          if git diff --cached --quiet; then
            echo "Materialized profile already committed."
            exit 0
          fi
          git config user.name "pqbtc-shrincslab-ci"
          git config user.email "pqbtc-shrincslab-ci@users.noreply.github.com"
          git commit -m "research: materialize dedicated SHRINCS public labnet"
          git push origin HEAD:integration/shrincslab-public-profile
