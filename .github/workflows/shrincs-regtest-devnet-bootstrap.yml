name: SHRINCS regtest devnet

on:
  push:
    branches:
      - integration/shrincs-regtest-devnet
  pull_request:
    paths:
      - "src/crypto/shrincs/**"
      - "src/script/interpreter.*"
      - "src/script/shrincs_tx_v0.*"
      - "src/consensus/params.h"
      - "src/kernel/chainparams.cpp"
      - "src/validation.cpp"
      - "src/crypto/CMakeLists.txt"
      - "src/CMakeLists.txt"
      - "src/test/CMakeLists.txt"
      - "src/test/shrincs_tx_v0*.cpp"
      - "test/functional/feature_shrincs_regtest.py"
      - "contrib/shrincs-tx/**"
      - "docs/PQBTC_SHRINCS_REGTEST*.md"
      - ".github/workflows/shrincs-regtest-devnet-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shrincs-regtest-devnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-spend:
    name: build, verify, spend, and mine private devnet
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out PQBTC
        uses: actions/checkout@v5

      - name: Prove activation scope is regtest-only
        run: |
          set -euo pipefail
          test "$(grep -R --line-number 'consensus\.shrincs_v0 = true' src/kernel/chainparams.cpp | wc -l)" -eq 1
          grep -q 'class CRegTestParams' src/kernel/chainparams.cpp
          grep -q 'bool shrincs_v0{false};' src/consensus/params.h
          grep -q 'SCRIPT_VERIFY_SHRINCS_V0' src/script/interpreter.cpp
          grep -q 'pqbtc_shrincs_verify' src/script/interpreter.cpp
          ! grep -q 'CheckECDSASignature.*SHRINCS' src/script/interpreter.cpp
          test -f src/crypto/shrincs/REGTEST_DEVNET_INTEGRATION

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            ninja-build \
            libboost-dev \
            libevent-dev \
            libsqlite3-dev \
            pkg-config

      - name: Configure wallet-enabled devnet build
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_GUI=OFF \
            -DBUILD_GUI_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_KERNEL_LIB=OFF \
            -DENABLE_WALLET=ON \
            -DENABLE_IPC=OFF \
            -DENABLE_EXTERNAL_SIGNER=OFF \
            -DWITH_ZMQ=OFF \
            -DWITH_USDT=OFF \
            -DBUILD_TESTS=ON

      - name: Build node, CLI, wallet, verifier, and tests
        run: cmake --build build --parallel 2

      - name: Execute both SHRINCS modes through interpreter
        run: |
          build/bin/test_pqbtc \
            --run_test=shrincs_tx_v0_signed_seam_tests \
            --catch_system_error=no \
            --log_level=test_suite

      - name: Execute transaction-envelope and resource tests
        run: |
          build/bin/test_pqbtc \
            --run_test=shrincs_tx_v0_tests \
            --catch_system_error=no \
            --log_level=test_suite

      - name: Check out the exact upstream signer model
        run: |
          set -euo pipefail
          SHRINCS_BIP_DIR="$RUNNER_TEMP/shrincs-bip"
          git init "$SHRINCS_BIP_DIR"
          git -C "$SHRINCS_BIP_DIR" remote add origin https://github.com/SHRINCS/shrincs-bip.git
          git -C "$SHRINCS_BIP_DIR" fetch --depth 1 origin acc6bda51dc3b94848d118967247ad0f3cd7a80e
          git -C "$SHRINCS_BIP_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$SHRINCS_BIP_DIR" rev-parse HEAD)" = acc6bda51dc3b94848d118967247ad0f3cd7a80e
          echo "SHRINCS_BIP_DIR=$SHRINCS_BIP_DIR" >> "$GITHUB_ENV"

      - name: Fund, sign, broadcast, and mine actual SHRINCS spends
        run: |
          python3 test/functional/feature_shrincs_regtest.py \
            --configfile="$PWD/build/test/config.ini" \
            --tmpdir="$RUNNER_TEMP/shrincs-functional"

      - name: Confirm validation did not rewrite tracked source
        run: git diff --exit-code
