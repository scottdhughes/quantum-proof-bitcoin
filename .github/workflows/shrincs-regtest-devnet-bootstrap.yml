name: SHRINCS regtest devnet integration

on:
  push:
    branches:
      - integration/shrincs-regtest-devnet
  pull_request:
    paths:
      - "src/crypto/shrincs/**"
      - "src/script/interpreter.*"
      - "src/script/shrincs_tx_v0.*"
      - "src/consensus/params.h"
      - "src/kernel/chainparams.cpp"
      - "src/validation.cpp"
      - "src/crypto/CMakeLists.txt"
      - "src/CMakeLists.txt"
      - "src/test/CMakeLists.txt"
      - "src/test/shrincs_tx_v0_signed_seam_tests.cpp"
      - "contrib/devtools/apply_shrincs_regtest_devnet.py"
      - ".github/workflows/shrincs-regtest-devnet-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shrincs-regtest-devnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-mine:
    name: build, verify, and mine private devnet
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out PQBTC
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize deterministic integration
        run: |
          set -euo pipefail
          python3 contrib/devtools/apply_shrincs_regtest_devnet.py
          git diff --check

      - name: Prove activation scope is regtest-only
        run: |
          set -euo pipefail
          test "$(grep -R --line-number 'consensus\.shrincs_v0 = true' src/kernel/chainparams.cpp | wc -l)" -eq 1
          grep -q 'class CRegTestParams' src/kernel/chainparams.cpp
          grep -q 'bool shrincs_v0{false};' src/consensus/params.h
          grep -q 'SCRIPT_VERIFY_SHRINCS_V0' src/script/interpreter.cpp
          grep -q 'pqbtc_shrincs_verify' src/script/interpreter.cpp
          ! grep -q 'CheckECDSASignature.*SHRINCS' src/script/interpreter.cpp

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            ninja-build \
            libboost-dev \
            libevent-dev \
            libsqlite3-dev \
            pkg-config

      - name: Configure wallet-enabled devnet build
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_GUI=OFF \
            -DBUILD_GUI_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_KERNEL_LIB=OFF \
            -DENABLE_WALLET=ON \
            -DENABLE_IPC=OFF \
            -DENABLE_EXTERNAL_SIGNER=OFF \
            -DWITH_ZMQ=OFF \
            -DWITH_USDT=OFF \
            -DBUILD_TESTS=ON

      - name: Build node, CLI, wallet, and PQ-first tests
        run: cmake --build build --parallel 2

      - name: Execute both SHRINCS modes through interpreter
        run: |
          build/bin/test_pqbtc \
            --run_test=shrincs_tx_v0_signed_seam_tests \
            --catch_system_error=no \
            --log_level=test_suite

      - name: Execute transaction-envelope parity and resource tests
        run: |
          build/bin/test_pqbtc \
            --run_test=shrincs_tx_v0_tests \
            --catch_system_error=no \
            --log_level=test_suite

      - name: Start node and mine private regtest blocks
        run: |
          set -euo pipefail
          DATADIR="$RUNNER_TEMP/pqbtc-shrincs-regtest"
          mkdir -p "$DATADIR"
          build/bin/pqbtcd -regtest -datadir="$DATADIR" -daemonwait
          trap 'build/bin/pqbtc-cli -regtest -datadir="$DATADIR" stop >/dev/null 2>&1 || true' EXIT
          build/bin/pqbtc-cli -regtest -datadir="$DATADIR" createwallet devnet >/dev/null
          ADDRESS=$(build/bin/pqbtc-cli -regtest -datadir="$DATADIR" getnewaddress)
          build/bin/pqbtc-cli -regtest -datadir="$DATADIR" generatetoaddress 101 "$ADDRESS" >/dev/null
          test "$(build/bin/pqbtc-cli -regtest -datadir="$DATADIR" getblockcount)" -eq 101
          BALANCE=$(build/bin/pqbtc-cli -regtest -datadir="$DATADIR" getbalance)
          python3 - "$BALANCE" <<'PY'
          from decimal import Decimal
          import sys
          assert Decimal(sys.argv[1]) > 0
          PY
          build/bin/pqbtc-cli -regtest -datadir="$DATADIR" stop >/dev/null
          trap - EXIT

      - name: Commit validated generated integration
        if: ${{ github.event_name == 'push' && github.ref_name == 'integration/shrincs-regtest-devnet' }}
        run: |
          set -euo pipefail
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "pqbtc-shrincs-ci"
          git config user.email "pqbtc-shrincs-ci@users.noreply.github.com"
          git add \
            src/crypto/shrincs \
            src/crypto/CMakeLists.txt \
            src/CMakeLists.txt \
            src/consensus/params.h \
            src/kernel/chainparams.cpp \
            src/script/interpreter.h \
            src/script/interpreter.cpp \
            src/script/shrincs_tx_v0.h \
            src/script/shrincs_tx_v0.cpp \
            src/validation.cpp \
            src/test/CMakeLists.txt \
            src/test/shrincs_tx_v0_signed_seam_tests.cpp \
            docs/PQBTC_SHRINCS_REGTEST_DEVNET.md
          git commit -m "research: activate SHRINCS v0 on private regtest devnet"
          git push origin HEAD:integration/shrincs-regtest-devnet
