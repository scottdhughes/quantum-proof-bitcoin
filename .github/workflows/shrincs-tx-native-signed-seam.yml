name: SHRINCS transaction native signed seam

on:
  pull_request:
    paths:
      - "src/script/shrincs_tx_v0.h"
      - "src/script/shrincs_tx_v0.cpp"
      - "src/test/shrincs_tx_v0_tests.cpp"
      - "src/test/shrincs_tx_v0_signed_seam_tests.cpp"
      - "src/test/shrincs_tx_v0_signed_seam_vectors.h"
      - "src/test/CMakeLists.txt"
      - "contrib/shrincs-ref/full_verify.c"
      - "contrib/shrincs-ref/stateful_verify.c"
      - "contrib/shrincs-ref/stateless_verify.c"
      - "ci/test/test_shrincs_tx_cpp_component.py"
      - ".github/workflows/shrincs-tx-native-signed-seam.yml"
  push:
    branches:
      - main
    paths:
      - "src/script/shrincs_tx_v0.h"
      - "src/script/shrincs_tx_v0.cpp"
      - "src/test/shrincs_tx_v0_tests.cpp"
      - "src/test/shrincs_tx_v0_signed_seam_tests.cpp"
      - "src/test/shrincs_tx_v0_signed_seam_vectors.h"
      - "src/test/CMakeLists.txt"
      - "contrib/shrincs-ref/full_verify.c"
      - "contrib/shrincs-ref/stateful_verify.c"
      - "contrib/shrincs-ref/stateless_verify.c"
      - "ci/test/test_shrincs_tx_cpp_component.py"
      - ".github/workflows/shrincs-tx-native-signed-seam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-signed-seam:
    name: native digest through independent verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out PQBTC
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce signed-seam-only scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | while read -r path; do
            case "$path" in
              src/test/shrincs_tx_v0_signed_seam_tests.cpp|src/test/shrincs_tx_v0_signed_seam_vectors.h|src/test/CMakeLists.txt|ci/test/test_shrincs_tx_cpp_component.py|.github/workflows/shrincs-tx-cpp-component.yml|.github/workflows/shrincs-tx-native-signed-seam.yml|docs/PQBTC_SHRINCS_TX_V0_NATIVE_SIGNED_SEAM.md) ;;
              *)
                echo "Unexpected native SHRINCS signed-seam path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Check out pinned libshrincs
        uses: actions/checkout@v5
        with:
          repository: remix7531/libshrincs
          ref: 53bedb2c4be6b0dcc0a16fee665339d4f7e4e5b5
          path: upstream/libshrincs
          persist-credentials: false

      - name: Validate architecture and inherited evidence contracts
        run: |
          python3 -m unittest ci.test.test_shrincs_tx_cpp_component
          python3 -m unittest ci.test.test_shrincs_tx_model
          python3 -m unittest ci.test.test_shrincs_full_verifier
          python3 ci/test/check_ci_inventory.py

      - name: Install focused native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            ninja-build \
            libboost-dev \
            libevent-dev \
            pkg-config

      - name: Configure opt-in native signed-seam build
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_GUI=OFF \
            -DBUILD_GUI_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_KERNEL_LIB=OFF \
            -DENABLE_WALLET=OFF \
            -DENABLE_IPC=OFF \
            -DENABLE_EXTERNAL_SIGNER=OFF \
            -DWITH_ZMQ=OFF \
            -DWITH_USDT=OFF \
            -DBUILD_TESTS=ON \
            -DPQBTC_ENABLE_SHRINCS_SIGNED_SEAM_TESTS=ON \
            -DPQBTC_LIBSHRINCS_SOURCE_DIR="$GITHUB_WORKSPACE/upstream/libshrincs"

      - name: Build native PQ-first unit binary with research verifier
        run: cmake --build build --target test_pqbtc --parallel 2

      - name: Verify both modes and all 56 native negative cases
        run: |
          build/bin/test_pqbtc \
            --run_test=shrincs_tx_v0_signed_seam_tests \
            --catch_system_error=no \
            --log_level=test_suite
