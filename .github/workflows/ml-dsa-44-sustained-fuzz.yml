name: ML-DSA-44 sustained verifier fuzzing

on:
  pull_request:
    paths:
      - ".github/workflows/ml-dsa-44-sustained-fuzz.yml"
      - "ci/test/test_ml_dsa_sustained_fuzz.py"
      - "ci/test/test_ml_dsa_stateful_signer_fuzz.py"
      - "contrib/ml-dsa-engineering/**"
      - "contrib/ml-dsa-ref/vectors.json"
      - "docs/ML_DSA_44_BACKEND_ADMISSION.md"
      - "docs/ML_DSA_44_WRAPPER_PROTOTYPE.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ml-dsa-44-sustained-fuzz.yml"
      - "ci/test/test_ml_dsa_sustained_fuzz.py"
      - "ci/test/test_ml_dsa_stateful_signer_fuzz.py"
      - "contrib/ml-dsa-engineering/**"
      - "contrib/ml-dsa-ref/vectors.json"
      - "docs/ML_DSA_44_BACKEND_ADMISSION.md"
      - "docs/ML_DSA_44_WRAPPER_PROTOTYPE.md"
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  verifier-fuzz:
    name: Strict verifier (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ASan + UBSan
            sanitizer: address-undefined
            coverage: 'true'
            artifact: asan-ubsan
          - label: MSan
            sanitizer: memory
            coverage: 'false'
            artifact: msan
    env:
      CC: clang

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          clang --version
          llvm-profdata-18 --version
          llvm-cov-18 --version
          python3 --version

      - name: Restore latest retained corpus
        id: retained
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_VARIANT: ${{ matrix.artifact }}
          ARTIFACT_PREFIX: ml-dsa-44-sustained-v2-${{ matrix.artifact }}
          RETAINED_WORKFLOW_PATH: .github/workflows/ml-dsa-44-sustained-fuzz.yml
          PRIOR_DIR: ${{ runner.temp }}/ml-dsa-44-prior
          SANITIZER: ${{ matrix.sanitizer }}
          OUTPUT_DIR: ${{ runner.temp }}/ml-dsa-44-fuzz-output
        run: |
          set -euo pipefail
          record_restore_failure() {
            status_code=$?
            trap - EXIT
            if (( status_code == 0 )); then
              return
            fi
            set +e
            mkdir -p "$OUTPUT_DIR"
            python3 - "$OUTPUT_DIR/retained-preflight.json" "$status_code" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          report = {
              "schema_version": 1,
              "status": "fail",
              "phase": "retained-corpus-preflight",
              "return_code": int(sys.argv[2]),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_head": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "sanitizer": os.environ["SANITIZER"],
          }
          Path(sys.argv[1]).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf8",
          )
          PY
            (
              cd "$OUTPUT_DIR"
              sha256sum retained-preflight.json > SHA256SUMS
            )
            exit "$status_code"
          }
          trap record_restore_failure EXIT
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$PRIOR_DIR"
          candidate_runs="$PRIOR_DIR/candidate-runs.tsv"
          : > "$candidate_runs"
          for source_event in schedule workflow_dispatch; do
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ml-dsa-44-sustained-fuzz.yml/runs?branch=main&event=$source_event&status=success&per_page=100" \
              --jq '.workflow_runs[] | [.created_at, (.id | tostring), (.run_attempt | tostring), .head_sha] | @tsv' \
              >> "$candidate_runs"
          done
          LC_ALL=C sort -t $'\t' -k1,1r -k2,2nr \
            "$candidate_runs" -o "$candidate_runs"

          source_run=""
          source_attempt=""
          source_head=""
          artifact_id=""
          artifact_name=""
          selected_v2=false
          while IFS=$'\t' read -r _created_at candidate_run \
            candidate_attempt candidate_head; do
            if [[ -z "$candidate_run" ]]; then
              continue
            fi
            [[ "$candidate_run" =~ ^[0-9]+$ ]]
            [[ "$candidate_attempt" =~ ^[0-9]+$ ]]
            [[ "$candidate_head" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$candidate_run" == "$GITHUB_RUN_ID" ]]; then
              continue
            fi
            if ! git merge-base --is-ancestor "$candidate_head" "$GITHUB_SHA"; then
              echo "Newest retained-source candidate is not ancestral: $candidate_head" >&2
              exit 1
            fi
            candidate_workflow="$PRIOR_DIR/workflow-$candidate_head.yml"
            git show "$candidate_head:$RETAINED_WORKFLOW_PATH" \
              > "$candidate_workflow"
            candidate_requires_v2=false
            if grep -Fq \
              'ARTIFACT_PREFIX: ml-dsa-44-sustained-v2-' \
              "$candidate_workflow"; then
              candidate_requires_v2=true
            fi
            candidate_name="$ARTIFACT_PREFIX-$candidate_run-$candidate_attempt"
            candidate_artifacts="$PRIOR_DIR/artifacts-$candidate_run-$candidate_attempt.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/artifacts?per_page=100" \
              > "$candidate_artifacts"
            matching_count="$(
              jq --arg name "$candidate_name" \
                '[.artifacts[] | select(.name == $name)] | length' \
                "$candidate_artifacts"
            )"
            if (( matching_count == 0 )); then
              if [[ "$candidate_requires_v2" == "true" ]]; then
                echo "Required v2 artifact is missing from run $candidate_run: $candidate_name" >&2
                exit 1
              fi
              continue
            fi
            if [[ "$candidate_requires_v2" != "true" ]]; then
              echo "Unexpected v2 artifact predates the committed v2 contract: $candidate_name" >&2
              exit 1
            fi
            if (( matching_count != 1 )); then
              echo "Expected exactly one artifact named $candidate_name; found $matching_count" >&2
              exit 1
            fi
            source_run="$candidate_run"
            source_attempt="$candidate_attempt"
            source_head="$candidate_head"
            artifact_name="$candidate_name"
            artifact_id="$(
              jq -er --arg name "$candidate_name" \
                '.artifacts[] | select(.name == $name) | .id' \
                "$candidate_artifacts"
            )"
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            selected_v2=true
            break
          done < "$candidate_runs"

          legacy_digest=""
          legacy_size=""
          if [[ "$selected_v2" != "true" ]]; then
            source_run=32924009052
            source_attempt=1
            source_head=0fa8f5fc4321f057fb758e4c2dc39b790023943c
            case "$SANITIZER" in
              address-undefined)
                test "$ARTIFACT_VARIANT" = "asan-ubsan"
                artifact_id=9591475482
                legacy_digest=sha256:43d37b2281b341e60e3b54424993a504936f701cf1ff8a40d59d15351c3e1e15
                legacy_size=2013751
                ;;
              memory)
                test "$ARTIFACT_VARIANT" = "msan"
                artifact_id=9591473287
                legacy_digest=sha256:2352231292015cc43880a71cf9481c88f3e86624654f9227d9767391be516f51
                legacy_size=1337936
                ;;
              *)
                echo "Unsupported sanitizer for retained bootstrap: $SANITIZER" >&2
                exit 1
                ;;
            esac
            artifact_name="ml-dsa-44-sustained-$ARTIFACT_VARIANT-$source_run-$source_attempt"
          fi

          run_json="$PRIOR_DIR/run.json"
          artifact_json="$PRIOR_DIR/artifact.json"
          archive="$PRIOR_DIR/retained.zip"
          extract_dir="$PRIOR_DIR/extracted"
          receipt="$PRIOR_DIR/retained-source-receipt.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run" \
            > "$run_json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            > "$artifact_json"

          jq -e \
            --argjson run "$source_run" \
            --argjson attempt "$source_attempt" \
            --arg head "$source_head" \
            '.id == $run and .run_attempt == $attempt and
             .head_sha == $head and .head_branch == "main" and
             (.event == "schedule" or .event == "workflow_dispatch") and
             .conclusion == "success"' \
            "$run_json" > /dev/null
          jq -e \
            --argjson id "$artifact_id" \
            --arg name "$artifact_name" \
            --argjson run "$source_run" \
            --arg head "$source_head" \
            '.id == $id and .name == $name and .expired == false and
             .workflow_run.id == $run and .workflow_run.head_sha == $head' \
            "$artifact_json" > /dev/null
          artifact_digest="$(
            jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
              "$artifact_json"
          )"
          artifact_size="$(
            jq -er '.size_in_bytes | select(type == "number" and . > 0)' \
              "$artifact_json"
          )"
          if [[ "$selected_v2" != "true" ]]; then
            test "$artifact_digest" = "$legacy_digest"
            test "$artifact_size" = "$legacy_size"
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$archive"
          test "$(stat -c '%s' "$archive")" = "$artifact_size"
          test "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$artifact_digest"

          python3 contrib/ml-dsa-engineering/run_verifier_fuzz.py \
            --validate-retained-archive "$archive" \
            --retained-run-metadata "$run_json" \
            --retained-artifact-metadata "$artifact_json" \
            --extract-retained-to "$extract_dir" \
            --expected-retained-sanitizer "$SANITIZER" \
            --expected-current-head "$GITHUB_SHA" \
            --write-retained-source-receipt "$receipt"
          test -d "$extract_dir/minimized-corpus"
          test -f "$receipt"
          {
            echo "seed_dir=$extract_dir/minimized-corpus"
            echo "receipt_path=$receipt"
          } >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Run bounded sustained campaign
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          COVERAGE: ${{ matrix.coverage }}
          RETAINED_SEED_DIR: ${{ steps.retained.outputs.seed_dir }}
          RETAINED_SOURCE_RECEIPT: ${{ steps.retained.outputs.receipt_path }}
          OUTPUT_DIR: ${{ runner.temp }}/ml-dsa-44-fuzz-output
        run: |
          set -euxo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            campaign_seconds=1800
            campaign_seed="$GITHUB_RUN_NUMBER"
            test -n "$RETAINED_SEED_DIR"
            test -d "$RETAINED_SEED_DIR"
            test -n "$RETAINED_SOURCE_RECEIPT"
            test -f "$RETAINED_SOURCE_RECEIPT"
          else
            campaign_seconds=60
            campaign_seed=188
          fi
          args=(
            --sanitizers
            --sanitizer "$SANITIZER"
            --seconds "$campaign_seconds"
            --seed "$campaign_seed"
            --output-dir "$OUTPUT_DIR"
          )
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(
              --seed-corpus "$RETAINED_SEED_DIR"
              --retained-source-receipt "$RETAINED_SOURCE_RECEIPT"
            )
          fi
          if [[ "$COVERAGE" == "true" ]]; then
            args+=(--coverage)
          fi
          python3 contrib/ml-dsa-engineering/run_verifier_fuzz.py "${args[@]}"

      - name: Verify campaign evidence
        if: success()
        env:
          EXPECTED_SANITIZER: ${{ matrix.sanitizer }}
          COVERAGE: ${{ matrix.coverage }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RETAINED_SOURCE_RECEIPT: ${{ steps.retained.outputs.receipt_path }}
          OUTPUT_DIR: ${{ runner.temp }}/ml-dsa-44-fuzz-output
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_COMMIT"
          python3 - "$OUTPUT_DIR" "$EXPECTED_SANITIZER" "$COVERAGE" \
            "$EXPECTED_COMMIT" "$EVENT_NAME" "$RUN_NUMBER" \
            "$RETAINED_SOURCE_RECEIPT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          output = Path(sys.argv[1])
          report = json.loads((output / "campaign.json").read_text(encoding="utf8"))
          long_run = sys.argv[5] in {"schedule", "workflow_dispatch"}
          expected_seconds = 1800 if long_run else 60
          expected_seed = int(sys.argv[6]) if long_run else 188
          require(report["schema_version"] == 1, "unexpected campaign schema")
          require(report["target"] == "strict-verifier", "unexpected fuzz target")
          require(report["status"] == "pass", "campaign did not pass")
          require(report["return_code"] == 0, "fuzzer returned nonzero")
          require(report["processing_error"] is None, "campaign processing failed")
          require(report["sanitizer"] == sys.argv[2], "sanitizer mismatch")
          require(
              report["coverage_enabled"] is (sys.argv[3] == "true"),
              "coverage setting mismatch",
          )
          require(report["repository_commit"] == sys.argv[4], "commit mismatch")
          require(report["repository_head"] == sys.argv[4], "HEAD mismatch")
          require(report["repository_dirty"] is False, "repository is dirty")
          require(
              report["campaign_limit"] == {
                  "runs": None,
                  "seconds": expected_seconds,
              },
              "campaign limit mismatch",
          )
          require(
              report["resource_limits"]["seed"] == expected_seed,
              "campaign seed mismatch",
          )
          engineering = Path("contrib/ml-dsa-engineering")
          sources = {
              "driver_sha256": engineering / "run_verifier_fuzz.py",
              "wrapper_test_driver_sha256": engineering / "run_wrapper_tests.py",
              "wrapper_sha256": engineering / "pqbtc_mldsa44.c",
              "public_header_sha256": engineering / "pqbtc_mldsa44.h",
              "config_header_sha256": engineering / "pqbtc_mldsa44_config.h",
              "fuzz_target_sha256": engineering / "pqbtc_mldsa44_verify_fuzz.c",
              "source_manifest_sha256": (
                  engineering / "vendor/mldsa-native/SOURCE.json"
              ),
          }
          for field, path in sources.items():
              require(
                  report["source_files"][field]
                  == hashlib.sha256(path.read_bytes()).hexdigest(),
                  f"source digest mismatch for {field}",
              )
          require(
              report["minimized_corpus"]["file_count"] > 0,
              "minimized corpus is empty",
          )
          require(
              report["crash_artifacts"]["file_count"] == 0,
              "unexpected crash artifacts",
          )
          require((output / "SHA256SUMS").is_file(), "SHA256SUMS is missing")
          if long_run:
              receipt_path = Path(sys.argv[7])
              require(receipt_path.is_file(), "retained-source receipt is missing")
              receipt = json.loads(receipt_path.read_text(encoding="utf8"))
              require(
                  report["retained_corpus_source"] == receipt,
                  "retained-source receipt mismatch",
              )
              retained_import = report["retained_corpus_import"]
              require(
                  isinstance(retained_import, dict),
                  "retained-corpus import metadata is missing",
              )
              require(
                  retained_import["source_summary"] == receipt["retained_corpus"],
                  "retained source summary mismatch",
              )
              imported_count = retained_import["imported_summary"]["file_count"]
              require(imported_count > 0, "no retained seeds were imported")
              require(
                  report["imported_retained_seeds"] == imported_count,
                  "retained import count mismatch",
              )
          else:
              require(
                  report["retained_corpus_source"] is None,
                  "short campaign recorded a retained source",
              )
              require(
                  report["retained_corpus_import"] is None,
                  "short campaign recorded a retained import",
              )
              require(
                  report["imported_retained_seeds"] == 0,
                  "short campaign imported retained seeds",
              )
          if report["coverage_enabled"]:
              require((output / "coverage.txt").is_file(), "coverage.txt is missing")
              require((output / "coverage.json").is_file(), "coverage.json is missing")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          cd "$OUTPUT_DIR"
          sha256sum --check SHA256SUMS

      - name: Upload retained corpus and evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ml-dsa-44-sustained-v2-${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ml-dsa-44-fuzz-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  stateful-signer-fuzz:
    name: Stateful signer (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ASan + UBSan
            sanitizer: address-undefined
            coverage: 'true'
            artifact: asan-ubsan
          - label: MSan
            sanitizer: memory
            coverage: 'false'
            artifact: msan
    env:
      CC: clang

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify toolchain and frozen signer corpus
        run: |
          set -euxo pipefail
          clang --version
          llvm-profdata-18 --version
          llvm-cov-18 --version
          python3 --version
          python3 contrib/ml-dsa-engineering/run_stateful_signer_fuzz.py \
            --manifest-only

      - name: Restore latest retained signer corpus
        id: retained
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ml-dsa-44-stateful-signer-${{ matrix.artifact }}
          PRIOR_DIR: ${{ runner.temp }}/ml-dsa-44-prior-stateful-signer
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          previous_run_records="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ml-dsa-44-sustained-fuzz.yml \
              --branch main \
              --status success \
              --limit 10 \
              --json databaseId,attempt,createdAt,headSha \
              --jq 'sort_by([.createdAt, .databaseId]) | reverse | .[] | [.databaseId, .attempt, .headSha] | @tsv'
          )"
          while read -r previous_run previous_attempt previous_head; do
            if [[ -z "$previous_run" || -z "$previous_attempt" || -z "$previous_head" ]]; then
              continue
            fi
            [[ "$previous_run" =~ ^[0-9]+$ ]]
            [[ "$previous_attempt" =~ ^[0-9]+$ ]]
            [[ "$previous_head" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$previous_head" HEAD
            artifact_name="$ARTIFACT_NAME-$previous_run-$previous_attempt"
            candidate_dir="$PRIOR_DIR/$previous_run-$previous_attempt"
            mkdir -p "$candidate_dir"
            if gh run download "$previous_run" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "$candidate_dir"; then
              validation_json="$PRIOR_DIR/validation-$previous_run-$previous_attempt.json"
              python3 contrib/ml-dsa-engineering/run_stateful_signer_fuzz.py \
                --validate-retained-evidence "$candidate_dir" \
                --expected-retained-head "$previous_head" \
                --expected-retained-sanitizer "$SANITIZER" \
                > "$validation_json"
              source_evidence_sha256="$(
                jq -er '.source_evidence_sha256' "$validation_json"
              )"
              restored_seed_file_count="$(
                jq -er '.restored_seed_file_count' "$validation_json"
              )"
              restored_seed_total_bytes="$(
                jq -er '.restored_seed_total_bytes' "$validation_json"
              )"
              restored_seed_aggregate_sha256="$(
                jq -er '.restored_seed_aggregate_sha256' "$validation_json"
              )"
              [[ "$source_evidence_sha256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$restored_seed_file_count" =~ ^[0-9]+$ ]]
              [[ "$restored_seed_total_bytes" =~ ^[0-9]+$ ]]
              [[ "$restored_seed_aggregate_sha256" =~ ^[0-9a-f]{64}$ ]]
              (( restored_seed_file_count > 0 ))
              {
                echo "seed_dir=$candidate_dir/minimized-corpus"
                echo "source_run=$previous_run"
                echo "source_attempt=$previous_attempt"
                echo "source_head=$previous_head"
                echo "source_artifact=$artifact_name"
                echo "source_evidence_sha256=$source_evidence_sha256"
                echo "restored_seed_file_count=$restored_seed_file_count"
                echo "restored_seed_total_bytes=$restored_seed_total_bytes"
                echo "restored_seed_aggregate_sha256=$restored_seed_aggregate_sha256"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$previous_run_records"
          echo "No prior successful retained signer corpus is available"

      - name: Run bounded stateful signer campaign
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          COVERAGE: ${{ matrix.coverage }}
          RETAINED_SEED_DIR: ${{ steps.retained.outputs.seed_dir }}
          RETAINED_SOURCE_RUN: ${{ steps.retained.outputs.source_run }}
          RETAINED_SOURCE_ATTEMPT: ${{ steps.retained.outputs.source_attempt }}
          RETAINED_SOURCE_HEAD: ${{ steps.retained.outputs.source_head }}
          RETAINED_SOURCE_ARTIFACT: ${{ steps.retained.outputs.source_artifact }}
          RETAINED_SOURCE_EVIDENCE_SHA256: ${{ steps.retained.outputs.source_evidence_sha256 }}
          RETAINED_SOURCE_SEED_COUNT: ${{ steps.retained.outputs.restored_seed_file_count }}
          RETAINED_SOURCE_SEED_BYTES: ${{ steps.retained.outputs.restored_seed_total_bytes }}
          RETAINED_SOURCE_SEED_AGGREGATE_SHA256: ${{ steps.retained.outputs.restored_seed_aggregate_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/ml-dsa-44-stateful-signer-output
        run: |
          set -euxo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            campaign_seconds=1800
            campaign_seed="$GITHUB_RUN_NUMBER"
          else
            campaign_seconds=60
            campaign_seed=188
          fi
          args=(
            --sanitizers
            --sanitizer "$SANITIZER"
            --seconds "$campaign_seconds"
            --seed "$campaign_seed"
            --output-dir "$OUTPUT_DIR"
          )
          if [[ -n "$RETAINED_SEED_DIR" ]]; then
            args+=(--seed-corpus "$RETAINED_SEED_DIR")
          fi
          if [[ "$COVERAGE" == "true" ]]; then
            args+=(--coverage)
          fi
          python3 contrib/ml-dsa-engineering/run_stateful_signer_fuzz.py \
            "${args[@]}"

      - name: Verify stateful signer evidence
        if: success()
        env:
          EXPECTED_SANITIZER: ${{ matrix.sanitizer }}
          COVERAGE: ${{ matrix.coverage }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RETAINED_SEED_DIR: ${{ steps.retained.outputs.seed_dir }}
          RETAINED_SOURCE_RUN: ${{ steps.retained.outputs.source_run }}
          RETAINED_SOURCE_ATTEMPT: ${{ steps.retained.outputs.source_attempt }}
          RETAINED_SOURCE_HEAD: ${{ steps.retained.outputs.source_head }}
          RETAINED_SOURCE_ARTIFACT: ${{ steps.retained.outputs.source_artifact }}
          RETAINED_SOURCE_EVIDENCE_SHA256: ${{ steps.retained.outputs.source_evidence_sha256 }}
          RETAINED_SOURCE_SEED_COUNT: ${{ steps.retained.outputs.restored_seed_file_count }}
          RETAINED_SOURCE_SEED_BYTES: ${{ steps.retained.outputs.restored_seed_total_bytes }}
          RETAINED_SOURCE_SEED_AGGREGATE_SHA256: ${{ steps.retained.outputs.restored_seed_aggregate_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/ml-dsa-44-stateful-signer-output
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_COMMIT"
          python3 - "$OUTPUT_DIR" "$EXPECTED_SANITIZER" "$COVERAGE" \
            "$EXPECTED_COMMIT" "$EVENT_NAME" "$RUN_NUMBER" \
            "$RETAINED_SEED_DIR" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys

          def named_file_summary(paths):
              digest = hashlib.sha256()
              contents = {}
              total_bytes = 0
              paths = sorted(paths, key=lambda path: path.name)
              for path in paths:
                  assert path.is_file() and not path.is_symlink()
                  data = path.read_bytes()
                  file_digest = hashlib.sha256(data).hexdigest()
                  digest.update(
                      f"{path.name}\0{len(data)}\0{file_digest}\n".encode()
                  )
                  previous = contents.setdefault(file_digest, data)
                  assert previous == data
                  total_bytes += len(data)
              return {
                  "file_count": len(paths),
                  "total_bytes": total_bytes,
                  "aggregate_sha256": digest.hexdigest(),
              }, contents

          def content_inventory_summary(contents):
              digest = hashlib.sha256()
              total_bytes = 0
              for file_digest, data in sorted(contents.items()):
                  digest.update(f"{len(data)}\0{file_digest}\n".encode())
                  total_bytes += len(data)
              return {
                  "file_count": len(contents),
                  "total_bytes": total_bytes,
                  "aggregate_sha256": digest.hexdigest(),
              }

          output = Path(sys.argv[1])
          report = json.loads((output / "campaign.json").read_text(encoding="utf8"))
          long_run = sys.argv[5] in {"schedule", "workflow_dispatch"}
          expected_seconds = 1800 if long_run else 60
          expected_seed = int(sys.argv[6]) if long_run else 188
          assert report["schema_version"] == 1
          assert report["target"] == "ml-dsa-44-stateful-signer-seeded-keygen"
          assert report["status"] == "pass"
          assert report["return_code"] == 0
          assert report["processing_error"] is None
          assert report["sanitizer"] == sys.argv[2]
          assert report["coverage_enabled"] is (sys.argv[3] == "true")
          assert report["repository_commit"] == sys.argv[4]
          assert report["repository_head"] == sys.argv[4]
          assert report["repository_dirty"] is False
          assert report["campaign_limit"] == {
              "runs": None,
              "seconds": expected_seconds,
          }
          assert report["resource_limits"]["seed"] == expected_seed
          assert report["resource_limits"]["harness_frame_bytes"] == 4456
          assert report["resource_limits"]["fuzzer_max_len_bytes"] == 4456
          assert expected_seconds - 1 <= report["fuzzer_duration_seconds"]
          assert report["fuzzer_duration_seconds"] <= expected_seconds + 35
          assert report["source_corpus"]["total_cases"] == 31
          assert report["source_corpus"]["unique_frames"] == 31
          assert (
              report["source_corpus"]["aggregate_sha256"]
              == "9ee9c275e59e8a4d383bd474b080406b764aafd9b219dffb522d9ef4e73f05d1"
          )
          engineering = Path("contrib/ml-dsa-engineering")
          sources = {
              "driver_sha256": engineering / "run_stateful_signer_fuzz.py",
              "verifier_fuzz_driver_sha256": engineering / "run_verifier_fuzz.py",
              "wrapper_test_driver_sha256": engineering / "run_wrapper_tests.py",
              "wrapper_sha256": engineering / "pqbtc_mldsa44.c",
              "public_header_sha256": engineering / "pqbtc_mldsa44.h",
              "test_header_sha256": engineering / "pqbtc_mldsa44_test.h",
              "config_header_sha256": engineering / "pqbtc_mldsa44_config.h",
              "fuzz_target_sha256": engineering / "pqbtc_mldsa44_stateful_fuzz.c",
              "source_manifest_sha256": (
                  engineering / "vendor/mldsa-native/SOURCE.json"
              ),
          }
          for field, path in sources.items():
              assert report["source_files"][field] == hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()
          assert report["deterministic_replay"]["status"] == "pass"
          assert report["deterministic_replay"]["case_count"] == 31
          assert all(
              case["status"] == "pass"
              for case in report["deterministic_replay"]["cases"]
          )
          assert report["executed_units"] is not None
          assert report["executed_units"] > 31
          assert report["minimized_corpus"]["file_count"] > 0
          assert report["crash_artifacts"]["file_count"] == 0
          assert (output / "SHA256SUMS").is_file()
          retained_source = report["retained_corpus_source"]
          if sys.argv[7]:
              expected_source = {
                  "run_id": os.environ["RETAINED_SOURCE_RUN"],
                  "run_attempt": os.environ["RETAINED_SOURCE_ATTEMPT"],
                  "head_sha": os.environ["RETAINED_SOURCE_HEAD"],
                  "artifact": os.environ["RETAINED_SOURCE_ARTIFACT"],
                  "evidence_sha256": os.environ[
                      "RETAINED_SOURCE_EVIDENCE_SHA256"
                  ],
                  "restored_seed_file_count": int(
                      os.environ["RETAINED_SOURCE_SEED_COUNT"]
                  ),
                  "restored_seed_total_bytes": int(
                      os.environ["RETAINED_SOURCE_SEED_BYTES"]
                  ),
                  "restored_seed_aggregate_sha256": os.environ[
                      "RETAINED_SOURCE_SEED_AGGREGATE_SHA256"
                  ],
              }
              assert retained_source == expected_source
              assert re.fullmatch(r"[0-9a-f]{40}", retained_source["head_sha"])
              assert re.fullmatch(
                  r"[0-9a-f]{64}", retained_source["evidence_sha256"]
              )
              assert re.fullmatch(
                  r"[0-9a-f]{64}",
                  retained_source["restored_seed_aggregate_sha256"],
              )
              expected_source_summary = {
                  "file_count": retained_source["restored_seed_file_count"],
                  "total_bytes": retained_source["restored_seed_total_bytes"],
                  "aggregate_sha256": retained_source[
                      "restored_seed_aggregate_sha256"
                  ],
              }
              seed_dir = Path(sys.argv[7])
              actual_source, source_contents = named_file_summary(
                  seed_dir.iterdir()
              )
              retained_import = report["retained_corpus_import"]
              assert retained_import["source_summary"] == expected_source_summary
              assert retained_import["source_summary"] == actual_source
              assert retained_import["unique_source_summary"] == (
                  content_inventory_summary(source_contents)
              )
              imported_paths = list(
                  (output / "corpus").glob("retained_*.bin")
              )
              _, imported_contents = named_file_summary(imported_paths)
              for path in imported_paths:
                  file_digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert path.name == f"retained_{file_digest}.bin"
              imported_summary = retained_import["imported_summary"]
              assert imported_summary == content_inventory_summary(
                  imported_contents
              )
              assert report["imported_retained_seeds"] == (
                  imported_summary["file_count"]
              )
              assert 0 < report["imported_retained_seeds"]
              assert (
                  report["imported_retained_seeds"]
                  <= retained_source["restored_seed_file_count"]
              )
          else:
              assert retained_source == {
                  "run_id": None,
                  "run_attempt": None,
                  "head_sha": None,
                  "artifact": None,
                  "evidence_sha256": None,
                  "restored_seed_file_count": None,
                  "restored_seed_total_bytes": None,
                  "restored_seed_aggregate_sha256": None,
              }
              assert report["imported_retained_seeds"] == 0
              assert report["retained_corpus_import"] is None
          if report["coverage_enabled"]:
              assert (output / "coverage.txt").is_file()
              assert (output / "coverage.json").is_file()
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          cd "$OUTPUT_DIR"
          sha256sum --check SHA256SUMS

      - name: Upload retained signer corpus and evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ml-dsa-44-stateful-signer-${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ml-dsa-44-stateful-signer-output
          if-no-files-found: warn
          retention-days: 90
          compression-level: 9
