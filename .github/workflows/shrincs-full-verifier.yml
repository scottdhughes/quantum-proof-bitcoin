name: SHRINCS full verifier research gate

on:
  pull_request:
    paths:
      - "contrib/shrincs/**"
      - "contrib/shrincs-ref/**"
      - "ci/test/test_shrincs_*.py"
      - ".github/workflows/shrincs-full-verifier.yml"
  push:
    branches:
      - main
    paths:
      - "contrib/shrincs/**"
      - "contrib/shrincs-ref/**"
      - "ci/test/test_shrincs_*.py"
      - ".github/workflows/shrincs-full-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verifier:
    name: strict dual-mode verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out PQBTC
        uses: actions/checkout@v5

      - name: Check out pinned libshrincs
        uses: actions/checkout@v5
        with:
          repository: remix7531/libshrincs
          ref: 53bedb2c4be6b0dcc0a16fee665339d4f7e4e5b5
          path: upstream/libshrincs
          persist-credentials: false

      - name: Check out pinned SHRINCS draft
        uses: actions/checkout@v5
        with:
          repository: SHRINCS/shrincs-bip
          ref: acc6bda51dc3b94848d118967247ad0f3cd7a80e
          path: upstream/shrincs-bip
          persist-credentials: false

      - name: Validate inherited research contracts
        run: |
          python3 contrib/shrincs/check_manifest.py --json
          python3 -m unittest discover -s ci/test -p 'test_shrincs_candidate.py'
          python3 -m unittest discover -s ci/test -p 'test_shrincs_wotsc_oracle.py'
          python3 -m unittest discover -s ci/test -p 'test_shrincs_stateful_oracle.py'
          python3 -m unittest discover -s ci/test -p 'test_shrincs_stateless_oracle.py'
          python3 -m unittest discover -s ci/test -p 'test_shrincs_full_verifier.py'

      - name: Build strict dual-mode verifier
        run: |
          mkdir -p build/shrincs-full
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror -O2 -fPIC -shared \
            -Iupstream/libshrincs/include \
            contrib/shrincs-ref/full_verify.c \
            contrib/shrincs-ref/stateful_verify.c \
            contrib/shrincs-ref/stateless_verify.c \
            upstream/libshrincs/src/wots.c \
            upstream/libshrincs/src/thash.c \
            upstream/libshrincs/src/sha256.c \
            upstream/libshrincs/src/util.c \
            -o build/shrincs-full/libpqbtc_shrincs_full_oracle.so

      - name: Generate deterministic stateful corpus
        run: |
          python3 contrib/shrincs-ref/check_stateful_fxmss.py \
            --libshrincs upstream/libshrincs \
            --shrincs-bip upstream/shrincs-bip \
            --library build/shrincs-full/libpqbtc_shrincs_full_oracle.so \
            --vectors-out build/shrincs-full/stateful-vectors.json \
            --json

      - name: Generate deterministic stateless corpus
        run: |
          python3 contrib/shrincs-ref/check_stateless.py \
            --libshrincs upstream/libshrincs \
            --shrincs-bip upstream/shrincs-bip \
            --library build/shrincs-full/libpqbtc_shrincs_full_oracle.so \
            --vectors-out build/shrincs-full/stateless-vectors.json \
            --json

      - name: Exercise strict full parser
        run: |
          python3 contrib/shrincs-ref/check_full.py \
            --library build/shrincs-full/libpqbtc_shrincs_full_oracle.so \
            --stateful-vectors build/shrincs-full/stateful-vectors.json \
            --stateless-vectors build/shrincs-full/stateless-vectors.json \
            --json
          sha256sum build/shrincs-full/stateful-vectors.json build/shrincs-full/stateless-vectors.json \
            | tee build/shrincs-full/corpus-sha256.txt

      - name: Build sanitizer verifier
        run: |
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g -fPIC -shared \
            -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -Iupstream/libshrincs/include \
            contrib/shrincs-ref/full_verify.c \
            contrib/shrincs-ref/stateful_verify.c \
            contrib/shrincs-ref/stateless_verify.c \
            upstream/libshrincs/src/wots.c \
            upstream/libshrincs/src/thash.c \
            upstream/libshrincs/src/sha256.c \
            upstream/libshrincs/src/util.c \
            -o build/shrincs-full/libpqbtc_shrincs_full_oracle_asan.so

      - name: Replay full corpus under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export LD_PRELOAD="$(cc -print-file-name=libasan.so)"
          python3 contrib/shrincs-ref/check_full.py \
            --library build/shrincs-full/libpqbtc_shrincs_full_oracle_asan.so \
            --stateful-vectors build/shrincs-full/stateful-vectors.json \
            --stateless-vectors build/shrincs-full/stateless-vectors.json \
            --json

      - name: Upload deterministic full-verifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: pqbtc-shrincs-full-verifier-evidence
          path: |
            build/shrincs-full/stateful-vectors.json
            build/shrincs-full/stateless-vectors.json
            build/shrincs-full/corpus-sha256.txt
          if-no-files-found: error
          retention-days: 30
