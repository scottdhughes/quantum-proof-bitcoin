name: ML-DSA-44 clean-checkout assembled system

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembled:
    name: Source build, wallet recovery and native qualification (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_DIR: /tmp/pqbtc-assembled-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify pristine checkout and host-only console checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m unittest discover -s ci/test -p 'test_ml_dsa_console_*.py'
          python3 -m unittest ci.test.test_ml_dsa_protocol_v1 ci.test.test_mldsa_node_wallet ci.test.test_ml_dsa_native_symbols ci.test.test_ml_dsa_native_process ci.test.test_mldsa_native_qualification ci.test.test_mldsa_public_wallet ci.test.test_mldsa_public_transport ci.test.test_mldsa_public_consensus_controls ci.test.test_mldsa_public_soak_agent ci.test.test_mldsa_public_soak ci.test.test_ml_dsa_public_console
          node --check contrib/ml-dsa-console/web/app.js
          node --check contrib/ml-dsa-console/web-public/app.js
          sh -n 'Launch-Local-Wallet.command' contrib/ml-dsa-console/launch.command contrib/ml-dsa-console/launch-public.command

      - name: Build native source without cache and test the assembled app
        run: |
          set -euo pipefail
          python3 contrib/ml-dsa-console/run_assembled_ci.py \
            --compiler "${{ matrix.compiler }}" --no-cache \
            --expect-head "$EXPECTED_HEAD" \
            --container "pqbtc-ci-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output-dir "$EVIDENCE_DIR"

      - name: Qualify native components, actual spend/restore and node resource bounds
        run: |
          set -euo pipefail
          python3 contrib/ml-dsa-qualification/run_native_qualification.py \
            --compiler "${{ matrix.compiler }}" \
            --descriptor "$EVIDENCE_DIR/runtime-descriptor.json" \
            --expect-head "$EXPECTED_HEAD" --expect-architecture x86_64 \
            --container "pqbtc-native-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output-dir "$EVIDENCE_DIR/native-qualification"

      - name: Test public-profile HTTP wallet and recovery on private test transport
        run: |
          set -euo pipefail
          python3 contrib/ml-dsa-qualification/run_public_app_ci.py \
            --descriptor "$EVIDENCE_DIR/runtime-descriptor.json" \
            --expect-head "$EXPECTED_HEAD" \
            --output-dir "$EVIDENCE_DIR/public-profile-app"

      - name: Verify source stayed unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload source, native and end-to-end evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pqbtc-assembled-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 90
