name: SHRINCS WOTS+C oracle

on:
  pull_request:
    paths:
      - "contrib/shrincs/**"
      - "contrib/shrincs-ref/**"
      - "ci/test/test_shrincs_candidate.py"
      - "ci/test/test_shrincs_wotsc_oracle.py"
      - ".github/workflows/shrincs-wotsc-oracle.yml"
  push:
    branches:
      - main
    paths:
      - "contrib/shrincs/**"
      - "contrib/shrincs-ref/**"
      - "ci/test/test_shrincs_candidate.py"
      - "ci/test/test_shrincs_wotsc_oracle.py"
      - ".github/workflows/shrincs-wotsc-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: current recovery and historical signing self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out PQBTC
        uses: actions/checkout@v5

      - name: Check out pinned libshrincs
        uses: actions/checkout@v5
        with:
          repository: remix7531/libshrincs
          ref: 911c583cc9c4e5e54a91695a1c6d2a114968715c
          path: upstream/libshrincs
          persist-credentials: false

      - name: Check out pinned SHRINCS draft
        uses: actions/checkout@v5
        with:
          repository: SHRINCS/shrincs-bip
          ref: a5891ec5b360a732c097e1d6af1ae59515a2560a
          path: upstream/shrincs-bip
          persist-credentials: false

      - name: Validate manifest and local harness tests
        run: |
          python3 contrib/shrincs/check_manifest.py --json
          python3 -m unittest discover -s ci/test -p 'test_shrincs_candidate.py'
          python3 -m unittest discover -s ci/test -p 'test_shrincs_wotsc_oracle.py'

      - name: Validate pristine sources before compilation
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("preflight", "contrib/shrincs-ref/check_libshrincs_wotsc.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          manifest = module.load_manifest(Path("contrib/shrincs/manifest.json"))
          module.validate_paths(manifest, Path("upstream/libshrincs"), Path("upstream/shrincs-bip"))
          print("frozen policy/pins/pristine source-byte preflight: PASS")
          PY

      - name: Build current recovery libraries
        run: |
          mkdir -p build/shrincs-wotsc
          cc -std=c99 -Wall -Wextra -Werror -O2 -fPIC -shared -Iupstream/libshrincs/include \
            upstream/libshrincs/src/{wots,thash,sha256,util}.c \
            -o build/shrincs-wotsc/normal.so
          cc -std=c99 -Wall -Wextra -Werror -O1 -g -fPIC -shared \
            -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -Iupstream/libshrincs/include upstream/libshrincs/src/{wots,thash,sha256,util}.c \
            -o build/shrincs-wotsc/sanitized.so

      - name: Qualify current recovery and historical zero-structure KATs
        run: |
          python3 contrib/shrincs-ref/check_libshrincs_wotsc.py \
            --libshrincs upstream/libshrincs \
            --shrincs-bip upstream/shrincs-bip \
            --library build/shrincs-wotsc/normal.so \
            --json

      - name: Qualify current recovery under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export LD_PRELOAD="$(cc -print-file-name=libasan.so)"
          python3 contrib/shrincs-ref/check_libshrincs_wotsc.py \
            --libshrincs upstream/libshrincs --shrincs-bip upstream/shrincs-bip \
            --library build/shrincs-wotsc/sanitized.so --json

      - name: Compile native historical keygen and signing self-tests
        run: make -C upstream/libshrincs clean test

      - name: Run libshrincs ASan and UBSan test target
        run: make -C upstream/libshrincs check-asan
