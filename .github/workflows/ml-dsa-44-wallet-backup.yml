name: ML-DSA-44 wallet backup pilot

on:
  pull_request:
    paths:
      - ".github/workflows/ml-dsa-44-wallet-backup.yml"
      - "contrib/ml-dsa-wallet-backup/**"
      - "contrib/ml-dsa-key-lifecycle/**"
      - "contrib/ml-dsa-engineering/**"
      - "contrib/ml-dsa-ref/review_baseline_commit.txt"
      - "contrib/shrincs/manifest.json"
      - ".github/workflows/ml-dsa-44-key-lifecycle.yml"
      - "ci/test/test_ml_dsa_key_lifecycle.py"
      - "docs/ML_DSA_44_KEY_LIFECYCLE.md"
      - "ci/test/test_ml_dsa_wallet_backup.py"
      - "docs/ML_DSA_44_WALLET_BACKUP*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ml-dsa-44-wallet-backup.yml"
      - "contrib/ml-dsa-wallet-backup/**"
      - "contrib/ml-dsa-key-lifecycle/**"
      - "contrib/ml-dsa-engineering/**"
      - "contrib/ml-dsa-ref/review_baseline_commit.txt"
      - "contrib/shrincs/manifest.json"
      - ".github/workflows/ml-dsa-44-key-lifecycle.yml"
      - "ci/test/test_ml_dsa_key_lifecycle.py"
      - "docs/ML_DSA_44_KEY_LIFECYCLE.md"
      - "ci/test/test_ml_dsa_wallet_backup.py"
      - "docs/ML_DSA_44_WALLET_BACKUP*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted recovery (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENSSL_PREFIX: /tmp/pqbtc-backup-openssl-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_DIR: /tmp/pqbtc-backup-evidence-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify pristine frozen inputs before any compilation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 contrib/ml-dsa-wallet-backup/run_backup_tests.py --preflight-only
          python3 -m unittest ci.test.test_ml_dsa_wallet_backup

      - name: Build checksum-pinned isolated OpenSSL 3.6.5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pqbtc-backup-openssl.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/openssl/openssl/releases/download/openssl-3.6.5/openssl-3.6.5.tar.gz \
            -o "$archive"
          contrib/ml-dsa-wallet-backup/build_openssl.sh "$archive" "$OPENSSL_PREFIX"

      - name: Prove encrypted recovery and zero-value process boundary
        run: |
          set -euo pipefail
          python3 contrib/ml-dsa-wallet-backup/run_backup_tests.py \
            --cc "${{ matrix.compiler }}" --expect-commit "$EXPECTED_HEAD" \
            --openssl-prefix "$OPENSSL_PREFIX" --output-dir "$EVIDENCE_DIR"

      - name: Verify unchanged runtime source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload complete source-bound pilot evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pqbtc-mldsa-wallet-backup-${{ matrix.compiler }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 90
